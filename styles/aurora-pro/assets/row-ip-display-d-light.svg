<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1692" height="170" viewBox="0 0 1692 170" role="img" aria-label="IP Display（浏览器扩展） — 显示当前 IP 与归属地。IP 归属地监控的前身，留着做个记录。 — 源码：https://github.com/decli/IPDisplayExtension"><title>IP Display（浏览器扩展） — 显示当前 IP 与归属地。IP 归属地监控的前身，留着做个记录。 — 源码：https://github.com/decli/IPDisplayExtension</title><style>@font-face{font-family:'xgeist';src:url(data:font/woff2;base64,) format('woff2');font-display:block}@font-face{font-family:'xgeistb';src:url(data:font/woff2;base64,) format('woff2');font-display:block}@font-face{font-family:'xsanssc';src:url(data:font/woff2;base64,) format('woff2');font-display:block}@font-face{font-family:'xsansscm';src:url(data:font/woff2;base64,) format('woff2');font-display:block}text{font-kerning:normal;font-synthesis:none;text-rendering:geometricPrecision}.up{animation:up 1s cubic-bezier(.16,1,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.fade{animation:fade 1s cubic-bezier(.16,1,.3,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.blink{animation:blink 1.06s steps(1,end) infinite}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}.halt{font-feature-settings:"halt"}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><defs><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="56" y2="0"><stop offset="0" stop-color="#5b3fd6"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs><path d="M0 1H1692" stroke="#122044" stroke-opacity="0.1" stroke-width="1.5"/><path d="M0 111H1692" stroke="#122044" stroke-opacity="0.1" stroke-width="1.5"/><rect x="0" y="28" width="56" height="56" rx="15.68" fill="#eef0ff"/><g transform="translate(12.88 40.88) scale(1.260)" fill="none" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="