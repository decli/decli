<svg xmlns="http://www.w3.org/2000/svg" width="276" height="228" viewBox="0 0 276 228" role="img" aria-labelledby="title">
<title id="title">思维小画本 — 给幼儿园大班孩子的思维训练游戏。把做不下去的纸质练习册改成十二个平板游戏，全程语音读题，不识字也能自己玩。</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
