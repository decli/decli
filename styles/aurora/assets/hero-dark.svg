<text x="72" y="212" font-size="74" font-weight="800" letter-spacing="-1" fill="#eaf0ff">十五个作品，<tspan fill="url(#hl)">一行代码没写</tspan></text>
<text x="72" y="268.0" font-size="21" fill="#a6b3d2">从 UI 交互设计到每一行代码编写，全部由 AI 完成。</text><text x="72" y="304.0" font-size="21" fill="#a6b3d2">我只做三件事：提出问题、选择方案、验收结果 —— 人出判断，AI 出产能。</text><text x="72" y="340.0" font-size="21" fill="#a6b3d2">不是尝鲜，这是 AI Native 时代工作新范式。</text>
<text x="72" y="408" fill="#78849f" font-size="16"><tspan font-size="34" font-weight="700" fill="#eaf0ff">15</tspan><tspan dx="8">个作品</tspan><tspan dx="34" font-size="34" font-weight="700" fill="#eaf0ff">4</tspan><tspan dx="8">个可在线体验</tspan><tspan dx="34" font-size="34" font-weight="700" fill="#a78bfa">0</tspan><tspan dx="8">行手写代码</tspan></text>
