<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="468" viewBox="0 0 1200 468" role="img" aria-labelledby="title">
<title id="title">decli — 十五个作品，一行代码没写。从 UI 交互设计到每一行代码编写，全部由 AI 完成。我只做三件事：提出问题、选择方案、验收结果 —— 人出判断，AI 出产能。不是尝鲜，这是 AI Native 时代工作新范式。</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}.b1{animation:f1 40s ease-in-out infinite}.b2{animation:f2 52s ease-in-out -14s infinite}.b3{animation:f3 46s ease-in-out -26s infinite}@keyframes f1{33%{transform:translate(48px,-36px)}66%{transform:translate(-60px,30px)}}@keyframes f2{33%{transform:translate(-40px,34px)}66%{transform:translate(56px,-20px)}}@keyframes f3{33%{transform:translate(36px,28px)}66%{transform:translate(-52px,-34px)}}.wind path{fill:none;stroke-linecap:round;stroke-dasharray:180 1400;animation:drift 26s linear infinite}.wind path:nth-child(2){animation-duration:34s;animation-delay:-6s}.wind path:nth-child(3){animation-duration:29s;animation-delay:-14s}.wind path:nth-child(4){animation-duration:38s;animation-delay:-3s}.wind path:nth-child(5){animation-duration:31s;animation-delay:-19s}@keyframes drift{to{stroke-dashoffset:-1580}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
