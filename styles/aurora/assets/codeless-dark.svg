<text x="144" y="147" font-size="44" font-weight="800" letter-spacing="-.5" fill="#eaf0ff">codeless</text>
<text x="64" y="212.0" font-size="19" fill="#a6b3d2">说一句话，它在容器里写代码、跑测试、改 bug，再由 CI</text><text x="64" y="243.0" font-size="19" fill="#a6b3d2">部署成一个能打开的网站。全程不用碰 IDE，做完接着说</text><text x="64" y="274.0" font-size="19" fill="#a6b3d2">「换成卡片风格」就能改。</text>
