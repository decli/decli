<svg xmlns="http://www.w3.org/2000/svg" width="551.9300000000001" height="101" viewBox="0 0 551.9300000000001 101" role="img" aria-labelledby="title">
<title id="title">你好，我是 decli 的 AI 分身。
他这两年做了十五个作品，一行代码没写 —— 代码都是 AI 写的，也包括我。想从哪儿聊起？</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}.typing{opacity:0;animation:typ 1.7s linear both}@keyframes typ{0%,88%{opacity:1}100%{opacity:0}}.dot{animation:bounce .9s ease-in-out infinite}.d1{animation-delay:.15s}.d2{animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.msg{animation:msg .45s cubic-bezier(.2,.8,.3,1) 1.55s both}@keyframes msg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="oca"><circle cx="18" cy="83" r="16"/></clipPath><radialGradient id="oba" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#b9c6ff"/><stop offset=".45" stop-color="#7c5cff"/><stop offset="1" stop-color="#3b5bd6"/></radialGradient><radialGradient id="o1a"><stop offset="0" stop-color="#06b6d4" stop-opacity=".95"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="o2a"><stop offset="0" stop-color="#ff77c8" stop-opacity=".75"/><stop offset="1" stop-color="#ff77c8" stop-opacity="0"/></radialGradient><radialGradient id="o3a"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#oca)"><circle cx="18" cy="83" r="16" fill="url(#oba)"/><g style="transform-origin:18px 83px"><ellipse cx="12.4" cy="87.8" rx="12.8" ry="8.8" fill="url(#o1a)"/></g><g style="transform-origin:18px 83px"><ellipse cx="24.4" cy="86.2" rx="11.2" ry="8.0" fill="url(#o2a)"/></g><g style="transform-origin:18px 83px"><ellipse cx="14.8" cy="75.8" rx="8.8" ry="4.8" fill="url(#o3a)"/></g></g><g class="typing"><rect x="48" y="57" width="64" height="42" rx="20" fill="#eef2f9"/><circle class="dot d0" cx="70" cy="79" r="3.5" fill="#7b879e"/><circle class="dot d1" cx="82" cy="79" r="3.5" fill="#7b879e"/><circle class="dot d2" cx="94" cy="79" r="3.5" fill="#7b879e"/></g><g class="msg"><path d="M68 1 H529.9300000000001 Q549.9300000000001 1 549.9300000000001 21 V80 Q549.9300000000001 100 529.9300000000001 100 H53 Q48 100 48 95 V21 Q48 1 68 1 Z" fill="#eef2f9"/><text x="66" y="35" font-size="15.5" fill="#101828">你好，我是 decli 的 AI 分身。</text><text x="66" y="60" font-size="15.5" fill="#101828">他这两年做了十五个作品，一行代码没写 —— 代码都是 AI 写的，也</text><text x="66" y="85" font-size="15.5" fill="#101828">包括我。想从哪儿聊起？</text></g>
</svg>
