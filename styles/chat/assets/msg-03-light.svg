<svg xmlns="http://www.w3.org/2000/svg" width="557.2" height="266" viewBox="0 0 557.2 266" role="img" aria-labelledby="title">
<title id="title">拿 codeless 说吧，它本身就是干这个的：你说一句话，它在断网的沙箱里写代码、跑测试、修 bug，再由 CI 部署上线。这是一次实测：</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="oca"><circle cx="18" cy="248" r="16"/></clipPath><radialGradient id="oba" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#b9c6ff"/><stop offset=".45" stop-color="#7c5cff"/><stop offset="1" stop-color="#3b5bd6"/></radialGradient><radialGradient id="o1a"><stop offset="0" stop-color="#06b6d4" stop-opacity=".95"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="o2a"><stop offset="0" stop-color="#ff77c8" stop-opacity=".75"/><stop offset="1" stop-color="#ff77c8" stop-opacity="0"/></radialGradient><radialGradient id="o3a"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#oca)"><circle cx="18" cy="248" r="16" fill="url(#oba)"/><g style="transform-origin:18px 248px"><ellipse cx="12.4" cy="252.8" rx="12.8" ry="8.8" fill="url(#o1a)"/></g><g style="transform-origin:18px 248px"><ellipse cx="24.4" cy="251.2" rx="11.2" ry="8.0" fill="url(#o2a)"/></g><g style="transform-origin:18px 248px"><ellipse cx="14.8" cy="240.8" rx="8.8" ry="4.8" fill="url(#o3a)"/></g></g><path d="M68 1 H535.2 Q555.2 1 555.2 21 V245 Q555.2 265 535.2 265 H53 Q48 265 48 260 V21 Q48 1 68 1 Z" fill="#eef2f9"/><text x="66" y="35" font-size="15.5" fill="#101828">拿 codeless 说吧，它本身就是干这个的：你说一句话，它在断网的</text><text x="66" y="60" font-size="15.5" fill="#101828">沙箱里写代码、跑测试、修 bug，再由 CI 部署上线。这是一次实测：</text><rect x="66" y="74" width="470" height="180" rx="14" fill="#ffffff" stroke="#122044" stroke-opacity="0.1"/><line x1="88" y1="98" x2="88" y2="200" stroke="#7b879e" stroke-opacity=".4" stroke-width="2"/><circle cx="88" cy="98" r="6" fill="#ffffff" stroke="#3b5bd6" stroke-width="2"/><circle cx="88" cy="98" r="2.8" fill="#3b5bd6"/><text x="106" y="103" font-size="14" font-weight="700" fill="#101828">需求</text><text x="520" y="103" font-size="13" fill="#7b879e" text-anchor="end">做一个咖啡店单页官网</text><circle cx="88" cy="132" r="6" fill="#ffffff" stroke="#3b5bd6" stroke-width="2"/><circle cx="88" cy="132" r="2.8" fill="#3b5bd6"/><text x="106" y="137" font-size="14" font-weight="700" fill="#101828">写代码</text><text x="520" y="137" font-size="13" fill="#7b879e" text-anchor="end">断网沙箱，13 次模型调用</text><circle cx="88" cy="166" r="6" fill="#ffffff" stroke="#3b5bd6" stroke-width="2"/><circle cx="88" cy="166" r="2.8" fill="#3b5bd6"/><text x="106" y="171" font-size="14" font-weight="700" fill="#101828">跑测试</text><text x="520" y="171" font-size="13" fill="#7b879e" text-anchor="end">验收测试一轮全绿</text><circle cx="88" cy="200" r="6" fill="#ffffff" stroke="#0f9d58" stroke-width="2"/><circle cx="88" cy="200" r="2.8" fill="#0f9d58"/><text x="106" y="205" font-size="14" font-weight="700" fill="#101828">上线</text><text x="520" y="205" font-size="13" fill="#7b879e" text-anchor="end">CI 部署，点开就能访问</text><text x="82" y="240" font-size="12.5" fill="#7b879e">单次成本 <tspan font-weight="700" fill="#101828">$0.0127</tspan> · POC 实测</text>
</svg>
