<svg xmlns="http://www.w3.org/2000/svg" width="537.98" height="101" viewBox="0 0 537.98 101" role="img" aria-labelledby="title">
<title id="title">他只做三件事：提出问题、选择方案、验收结果。
从界面设计到每一行代码，都交给 AI。用他的话说：人出判断，AI 出产能。</title>
