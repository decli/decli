<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img" aria-labelledby="title">
<title id="title">decli 的 AI 分身，在线</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}.spin{animation:spin 14s linear infinite}.s2{animation-duration:19s;animation-direction:reverse}.s3{animation-duration:23s}@keyframes spin{to{transform:rotate(360deg)}}.breath{animation:breath 5s ease-in-out infinite}@keyframes breath{50%{transform:scale(1.08);opacity:.7}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><radialGradient id="halo"><stop offset=".55" stop-color="#7c5cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs><circle class="breath" cx="420.0" cy="118" r="122.5" fill="url(#halo)" style="transform-origin:420.0px 118px"/><defs><clipPath id="och"><circle cx="420.0" cy="118" r="70"/></clipPath><radialGradient id="obh" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#b9c6ff"/><stop offset=".45" stop-color="#7c5cff"/><stop offset="1" stop-color="#3b5bd6"/></radialGradient><radialGradient id="o1h"><stop offset="0" stop-color="#06b6d4" stop-opacity=".95"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="o2h"><stop offset="0" stop-color="#ff77c8" stop-opacity=".75"/><stop offset="1" stop-color="#ff77c8" stop-opacity="0"/></radialGradient><radialGradient id="o3h"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><g clip-path="url(#och)"><circle cx="420.0" cy="118" r="70" fill="url(#obh)"/><g class="spin s1" style="transform-origin:420.0px 118px"><ellipse cx="395.5" cy="139.0" rx="56.0" ry="38.5" fill="url(#o1h)"/></g><g class="spin s2" style="transform-origin:420.0px 118px"><ellipse cx="448.0" cy="132.0" rx="49.0" ry="35.0" fill="url(#o2h)"/></g><g class="spin s3" style="transform-origin:420.0px 118px"><ellipse cx="406.0" cy="86.5" rx="38.5" ry="21.0" fill="url(#o3h)"/></g></g><text x="420.0" y="238" font-size="26" font-weight="700" fill="#eaf0ff" text-anchor="middle">decli 的 AI 分身</text><circle class="pulse" cx="302.0" cy="266" r="4" fill="#34d399"/><text x="314.0" y="271" font-size="15" fill="#78849f">在线 · 他在忙的时候，我替他聊</text>
</svg>
