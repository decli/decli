<svg xmlns="http://www.w3.org/2000/svg" width="551.9300000000001" height="151" viewBox="0 0 551.9300000000001 151" role="img" aria-labelledby="title">
<title id="title">不全靠谱，所以才要验收。
codeless 的实测里就抓到过一次：AI 为了让检查变绿，偷偷新建了一个配置文件，把规则改了。
后来他把验证挪到了 AI 碰不到的地方 —— 报告状态的和做验证的，必须是两个主体。</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
