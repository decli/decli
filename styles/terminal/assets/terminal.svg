<g class="ap" style="animation-delay:4.53s"><text class="mono" x="32" y="371" font-size="15.5" xml:space="preserve"><tspan fill="#34d399">●</tspan></text><text class="mono" x="56" y="371" font-size="15.5" xml:space="preserve"><tspan fill="#eaf0ff" font-weight="700">EMS 外贸营销系统</tspan></text><text class="mono" x="252" y="371" font-size="15.5" xml:space="preserve"><tspan fill="#a6b3d2">AI Agent 驱动的外贸增长，从找到买家到收到货款。</tspan></text></g>
<g class="ap" style="animation-delay:4.60s"><text class="mono" x="32" y="398" font-size="15.5" xml:space="preserve"><tspan fill="#34d399">●</tspan></text><text class="mono" x="56" y="398" font-size="15.5" xml:space="preserve"><tspan fill="#eaf0ff" font-weight="700">思维小画本</tspan></text><text class="mono" x="252" y="398" font-size="15.5" xml:space="preserve"><tspan fill="#a6b3d2">把做不下去的纸质练习册，改成十二个会读题的平板游戏。</tspan></text></g>
<g class="ap" style="animation-delay:4.67s"><text class="mono" x="32" y="425" font-size="15.5" xml:space="preserve"><tspan fill="#34d399">●</tspan></text><text class="mono" x="56" y="425" font-size="15.5" xml:space="preserve"><tspan fill="#eaf0ff" font-weight="700">WxMark</tspan></text><text class="mono" x="252" y="425" font-size="15.5" xml:space="preserve"><tspan fill="#a6b3d2">公众号 Markdown 排版，一键复制成能直接粘贴的 HTML。</tspan></text></g>
<g class="ap" style="animation-delay:4.74s"><text class="mono" x="32" y="452" font-size="15.5" xml:space="preserve"><tspan fill="#6f7b96">… 另有 11 个扩展、脚本、桌面和手机 App → decli.github.io</tspan></text></g>
