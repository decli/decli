<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title">
<title id="title">decli 的终端：whoami → decli, AI Architect, San Jose。十五个作品，一行代码没写。从 UI 交互设计到每一行代码编写，全部由 AI 完成。我只做三件事：提出问题、选择方案、验收结果 —— 人出判断，AI 出产能。不是尝鲜，这是 AI Native 时代工作新范式。 在线作品：信风 Tradewind、EMS 外贸营销系统、思维小画本、WxMark。</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}.ap{animation:ap .12s linear both}@keyframes ap{from{opacity:0}to{opacity:1}}.cv{transform:scaleX(0);transform-box:fill-box;transform-origin:100% 50%}@keyframes type{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
