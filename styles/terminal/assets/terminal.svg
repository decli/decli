<g class="ap" style="animation-delay:2.85s"><text class="mono" x="32" y="236" font-size="15.5" xml:space="preserve"><tspan fill="#a6b3d2">我只做三件事：提出问题、选择方案、验收结果 —— 人出判断，AI 出产能。</tspan></text></g>
