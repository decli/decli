<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="储能 PACK 线官网">
  <!-- 储能 PACK 线官网：跟站点标志同一个图形 —— 两条错开的电芯层 + 一道绿色能量流。
       作品集用的是透明底的原版（/icons/ctne.svg）；这里垫一块品牌深蓝的圆角底，跟其他作品的应用图标一致，深浅背景下都看得清。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16406a"/>
      <stop offset="1" stop-color="#0b2138"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g transform="translate(10.5 9.5) scale(.69)">
    <rect x="8" y="10" width="40" height="10" rx="5" fill="#fff"/>
    <rect x="15" y="25" width="40" height="10" rx="5" fill="#fff" opacity=".72"/>
    <path d="M9 45h27c8.5 0 10.5 8 19 8" stroke="#3fbf6f" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
</svg>
